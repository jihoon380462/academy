<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academy · PC와 모바일 화면</title><style>*{box-sizing:border-box}body{margin:0;background:#e6e9e0;font-family:Arial,'Noto Sans KR',sans-serif;color:#2d4936}.board{width:1320px;padding:24px 28px;height:905px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:23px}.top small{font-size:10px;letter-spacing:1.5px;color:#778470}.top h1{font-size:26px;font-weight:500;letter-spacing:-1px;margin:10px 0 0}.top a{font-size:12px;color:inherit;text-decoration:none}.screens{display:flex;gap:24px}.label{font-size:10px;letter-spacing:1px;display:flex;justify-content:space-between;color:#718268;margin-bottom:10px}.desktop{width:990px;height:735px;overflow:hidden;border:1px solid #d1d9c9;border-radius:10px;background:#f7f6ef}.desktop iframe{width:1440px;height:1070px;border:0;transform:scale(.6875);transform-origin:top left}.mobile{width:250px;height:554px;border:6px solid #304b39;overflow:hidden;border-radius:26px;background:#f7f6ef}.mobile iframe{width:390px;height:888px;border:0;transform:scale(.6102564);transform-origin:top left}.note{font-size:12px;line-height:1.9;width:250px;color:#6e8067;margin-top:23px}.caption{font-size:10px;color:#778470;padding-top:18px}</style><script src="subjects.js?v=0.1.0-python-ch07-ch09-1"></script><script src="python-content.js?v=0.1.0-python-ch07-ch09-1"></script></head><body><main class="board"><div class="top"><div><small>ACADEMY · 개념에서 시작하는 배움</small><h1 id="title">학습 분야 · 배움의 시작</h1></div><a href="index.html" id="open-page">Academy 열기 ↗</a></div><div class="screens"><div><div class="label"><span>DESKTOP</span><span>1440 PX</span></div><div class="desktop"><iframe id="desktop" title="PC 화면"></iframe></div></div><div><div class="label"><span>MOBILE</span><span>390 PX</span></div><div class="mobile"><iframe id="mobile" title="모바일 화면"></iframe></div><p class="note" id="preview-note">수학에서 프로그래밍과 컴퓨터 과학까지.<br>분야를 넓히고, 이해를 쌓아갑니다.<br><br>배울 분야를 고르고,<br>개념과 원리부터 차근차근 시작하세요.</p></div></div><div class="caption">Academy · PC / 모바일 반응형 학습 공간</div></main><script>
const q = new URLSearchParams(location.search);
const lessonId = q.get('lesson');
const page = q.get('page') || 'home';
const subject = q.get('subject');
const validSlug = value => typeof value === 'string' && /^[a-z][a-z0-9-]*$/.test(value);
const subjects = Object.fromEntries(window.ACADEMY_SUBJECTS.map(subject => [subject.id, subject.title]));
const pyCourses = window.PYTHON_COURSES;
const pyCourse = pyCourses.find(course => course.lessons.some(lesson => lesson.id === lessonId)) || pyCourses.find(course => course.slug === q.get('chapter')) || pyCourses[0];
const pyPath = '/python/' + pyCourse.slug;
const paths = {'python-chapter':pyPath,'python-review':pyPath+'/review',home:'/',math:'/subjects/math',chapter:'/math/middle-1',review:'/math/middle-1/review',progress:'/progress'};
const titles = {'python-chapter':'파이썬 · 챕터 '+pyCourse.number+' 목차','python-review':'파이썬 · 챕터 '+pyCourse.number+' 복습',home:'학습 분야 · 배움의 시작',math:'수학 · 개념으로 이어지는 교과서',chapter:'중학 1학년 · 전체 목차',review:'수학 챕터 복습 · 개념을 다시 연결하기',progress:'내 학습 · 이해를 쌓는 기록'};
let route = paths[page] || '/';
let title = titles[page] || 'Academy · 학습 분야';
if (validSlug(lessonId)) {
  route = (lessonId.startsWith('python-') ? pyPath+'/lesson/' : '/math/middle-1/lesson/') + lessonId;
  title = lessonId.startsWith('python-') ? '파이썬 챕터 '+pyCourse.number+' · '+pyCourse.title : '수학 개념 레슨 · 이유부터 이해하기';
} else if (validSlug(subject)) {
  route = '/subjects/' + subject;
  title = (subjects[subject] || subject) + ' · 학습 분야';
} else if (Object.hasOwn(subjects,page)) {
  route = '/subjects/' + page;
  title = subjects[page] + ' · 학습 분야';
}
for (const frame of document.querySelectorAll('iframe')) frame.src = 'index.html#' + route;
document.querySelector('#title').textContent = title;
document.querySelector('#open-page').href = 'index.html#' + route;
if (route.startsWith('/math/') || route === '/subjects/math') {
  document.querySelector('#preview-note').innerHTML = '수학 · 중학 1학년 전체를 한 챕터로.<br>8개 단원 · 30개 레슨<br>레슨별 예제 5개 · 챕터 복습 10개<br><br>원리를 읽고, 그림으로 이해하고,<br>간단한 문제로 확인합니다.';
}
if(route.startsWith('/python/'))document.querySelector('#preview-note').textContent=pyCourse.title+' · '+pyCourse.lessons.length+'개 레슨 · 예제 '+pyCourse.lessons.reduce((sum, lesson)=>sum+lesson.examples.length,0)+'개 · 복습 '+pyCourse.review.length+'개. 코드와 예상 출력을 읽고, 작은 원리부터 이해합니다.';
if(route==='/subjects/python')document.querySelector('#preview-note').textContent='파이썬 기초 · '+pyCourses.length+'개 챕터 · '+pyCourses.reduce((sum, course)=>sum+course.lessons.length,0)+'개 레슨. 코드를 직접 작성하고 실행하며 원리를 이해합니다.';
</script></body></html>
